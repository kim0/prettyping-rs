name: Publish Crate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Verify tag/version sync
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./.github/scripts/verify-tag-version.sh "${GITHUB_REF_NAME}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via OIDC
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@v1.0.3

      - name: Publish crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi
