[package]
name = "prettyping-rs"
version = "1.0.0"
edition = "2024"
description = "Rust port of prettyping with a pure Rust ping engine"
license = "MIT"
repository = "https://github.com/kim0/prettyping-rs"
readme = "README.md"
keywords = ["ping", "network", "latency", "terminal", "cli"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "prettyping_rs"
path = "src/lib.rs"

[[bin]]
name = "prettyping"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive", "env"] }
terminal_size = "0.4.3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "0.4.3"
surge-ping = "0.8.4"

[target.'cfg(target_os = "windows")'.dependencies]
ctrlc = "3.5.2"
ping-async = "1.0.2"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
assert_matches = "1.5.0"
